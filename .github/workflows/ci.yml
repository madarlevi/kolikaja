# Copyright (C) 2026 madarlevi
#
# Continuous integration for madarlevi/kolikaja.
# Jobs for components that do not exist yet (web, Compose) are skipped through the
# `detect` job (hashFiles() is not available in job-level `if`). The Go, migration and
# CodeQL Go jobs always run: apps/api exists, so deleting files cannot switch them off.
# The security tooling is described in docs/SECURITY-PLAN.md. Third-party actions are
# pinned to full commit SHAs; Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly on main: CodeQL, govulncheck, gitleaks, Semgrep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  REDOCLY_CLI_VERSION: "2.84.0"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  GOSEC_VERSION: "v2.30.0"
  GOVULNCHECK_VERSION: "v1.10.0"
  ACTIONLINT_VERSION: "v1.7.12"
  MIGRATE_VERSION: "v4.20.1"
  SEMGREP_VERSION: "1.187.0"
  SEMGREP_SEND_METRICS: "off" # no telemetry (CLAUDE.md)

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.files.outputs.web }}
      compose: ${{ steps.files.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check which components exist
        id: files
        run: |
          {
            echo "web=${{ hashFiles('apps/web/package.json') != '' }}"
            echo "compose=${{ hashFiles('docker-compose.yml') != '' }}"
          } | tee -a "$GITHUB_OUTPUT"

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: actionlint (with shellcheck)
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color

  openapi:
    name: OpenAPI contract and authorization matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint the contract (Redocly)
        run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint docs/api/openapi.yaml
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check the authorization matrix (one row per operation)
        env:
          # Set to "1" when phase 2 closes: then every dormitory-scoped operation needs an
          # implemented TestAuthz_ test (docs/SECURITY-PLAN.md, security gate).
          AUTHZ_REQUIRE_TESTS: "0"
        run: scripts/check-authz-matrix.sh

  go:
    name: Go (fmt, vet, test, golangci-lint, gosec, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt found unformatted files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: golangci-lint (gosec enabled)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api
      - name: gosec
        run: go run "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}" -quiet ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  migrations:
    name: Database tests (migrations, constraints, authorization, API flows; PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kolikaja_ci
          POSTGRES_DB: kolikaja_ci
          # Ephemeral database inside the job; trust auth avoids a credential in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kolikaja_ci -d kolikaja_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kolikaja_ci@localhost:5432/kolikaja_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: golang-migrate CLI (up, down 1, up, down all)
        run: |
          go install -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}"
          migrate_bin="$(go env GOPATH)/bin/migrate"
          run_migrate() { "$migrate_bin" -path apps/api/migrations -database "$DATABASE_URL" "$@"; }
          run_migrate up
          run_migrate version
          run_migrate down 1
          run_migrate up
          run_migrate down -all
      - name: Migration, constraint, authorization (TestAuthz_*) and API flow tests
        working-directory: apps/api
        env:
          KOLIKAJA_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        # -p 1: the packages share the database and each one resets the schema.
        run: go test -p 1 -count=1 -v ./tests/integration/... ./tests/authz/... ./tests/flows/...

  web:
    name: Web (audit, lint, typecheck, test, build)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Require eslint-plugin-security
        run: |
          node -e "const p=require('./package.json');const d={...p.dependencies,...p.devDependencies};if(!d['eslint-plugin-security']){console.error('eslint-plugin-security must be a devDependency (docs/SECURITY-PLAN.md)');process.exit(1)}"
      - name: npm audit (high and critical fail)
        run: npm audit --audit-level=high
      - name: Lint (includes eslint-plugin-security)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    name: SQL injection and code rules (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: Test the custom rules
        # --test skips hidden directories, so every rule is passed explicitly with its test file.
        run: |
          semgrep --test --config .semgrep/go-sql-string-building.yml .semgrep/go-sql-string-building.go
          semgrep --test --config .semgrep/ts-sql-string-building.yml .semgrep/ts-sql-string-building.ts
      - name: Scan (custom rules + Go and TypeScript rulesets)
        run: >-
          semgrep scan --metrics=off --error
          --config .semgrep
          --config p/golang
          --config p/typescript
          --exclude .semgrep
          .

  codeql-go:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: go
          build-mode: autobuild
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:go

  codeql-js:
    name: CodeQL (javascript-typescript)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript

  code-scanning-gate:
    name: Security gate (no open high or critical code-scanning alerts)
    needs: [codeql-go, codeql-js]
    # Runs even when codeql-js is skipped (no web app yet); fails if an analysis failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: CodeQL analyses succeeded or were skipped
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::a CodeQL analysis failed"
          exit 1
      - name: No open high or critical alerts on this ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          alerts="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical" or (.rule.security_severity_level == null and .rule.severity == "error")) | "\(.rule.security_severity_level // .rule.severity) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"')"
          if [ -n "$alerts" ]; then
            echo "$alerts"
            echo "::error::open high or critical code-scanning alerts on ${REF} (docs/SECURITY-PLAN.md, security gate)"
            exit 1
          fi
          echo "no open high or critical code-scanning alerts on ${REF}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  docker:
    name: Docker image and Compose smoke test
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Start the stack exactly as the README says (no .env file)
        run: |
          test ! -e .env
          docker compose up -d --build
      - name: Smoke test
        env:
          SMOKE_TOKEN_FILE: ${{ runner.temp }}/smoke-token
        run: deploy/scripts/smoke-test.sh http://localhost:8080
      - name: Container hardening checks
        run: |
          for svc in api migrate secrets-init; do
            id="$(docker compose ps -a -q "$svc")"
            docker inspect --format '{{.Name}} user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}}' "$id"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
          done
          test "$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q api)")" = "65532:65532"
          docker compose logs secrets-init | grep -q 'jwt_secret: generated'
          # PostgreSQL must not publish any port to the host.
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q postgres)")" = "{}"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Injection payload harness against the running API
        working-directory: apps/api
        env:
          KOLIKAJA_API_URL: http://localhost:8080
          KOLIKAJA_SECURITY_ALLOW_WRITES: "1"
        run: |
          token="$(cat "$RUNNER_TEMP/smoke-token")"
          echo "::add-mask::$token"
          KOLIKAJA_API_TOKEN="$token" go test -count=1 -v -run TestInjectionPayloads ./tests/security/
      - name: No 5xx responses and no secrets in the API log
        run: |
          docker compose logs --no-color api > api.log
          if grep -q '"status":5[0-9][0-9]' api.log; then grep '"status":5' api.log | head -20; exit 1; fi
          # Tokens and password hashes must never be logged (route names may contain "password").
          if grep -qiE 'bearer [a-z0-9_-]{8}|\$argon2id\$|eyJhbGciOi' api.log; then echo "credential in the API log"; exit 1; fi
      - name: Restart keeps the generated secrets and the data
        run: |
          docker compose down
          docker compose up -d
          deploy/scripts/smoke-test.sh http://localhost:8080
          docker compose logs secrets-init | grep -q 'jwt_secret: kept'
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  zap:
    name: OWASP ZAP baseline scan
    needs: [detect, docker]
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 90); do curl -fsS http://localhost:8080/readyz && break; sleep 2; done
          curl -fsS http://localhost:8080/readyz
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/api/v1/meta
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: false
          fail_action: true
      - name: Stop the stack
        if: always()
        run: docker compose down -v
