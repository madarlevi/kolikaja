# CodeQL configuration (used by the codeql-go and codeql-js jobs of ci.yml).
name: KoliKaja CodeQL
queries:
  - uses: security-extended
paths-ignore:
  # Deliberately vulnerable Semgrep rule test cases.
  - .semgrep
  - "**/node_modules"
  - "**/dist"
