    patch:
      tags: [members]
      operationId: updateMember
      summary: Change role or trusted reviewer status
      description: |
        Moderators may change `is_trusted_reviewer`. Only dormitory administrators may change `role`.
        Nobody can change their own role or trusted reviewer status, and the last administrator cannot be
        demoted (`409 last_admin`). When an administrator is demoted, the API keys and invitation codes
        they created for this dormitory are revoked in the same transaction.
      security:
