    get:
      tags: [moderation]
      operationId: listSanctions
      summary: List sanctions of the dormitory
      x-required-role: moderator
      x-rate-limit: read
      parameters:
        - name: active_only
          in: query
          description: Return only sanctions that are currently in force.
          schema:
            type: boolean
            default: true
        - name: user_id
          in: query
          description: Filter by sanctioned user.
          schema:
