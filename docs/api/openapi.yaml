components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-kk_access
      description: |
        Web clients. Short-lived JWT access token in an HttpOnly, Secure, SameSite=Lax cookie
        (Path=/). Set by `loginWeb` and `refreshWeb`. JavaScript never reads it.
        In development without TLS the `__Host-` prefix is dropped (cookie name `kk_access`).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required together with `cookieAuth` on every state-changing request. The value is the content of
        the `__Host-kk_csrf` cookie (readable by JavaScript, SameSite=Strict). The token is an HMAC bound
        to the session ID; the server compares it in constant time before running the handler and also
        checks the `Origin` header.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-kk_refresh
      description: |
        Opaque refresh token in an HttpOnly, Secure, SameSite=Strict cookie restricted to
        Path=/api/v1/auth/web/refresh. Rotated on every use.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Native clients. Short-lived JWT access token (HS256, claims `sub`, `sid`, `iat`, `exp`, `iss`,
        `aud`, `typ`). The server also checks on every request that the session is not revoked.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Server-to-server integrations only. Format `kk_<12 character id>_<secret>`. Never embed an API key
        in the web, Android or iOS apps. Keys are scoped, expire, can be revoked, are rate limited per key
        and pass the same tenant checks as users.

  parameters:
    DormitoryId:
      name: dormitoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SanctionId:
      name: sanctionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UploadId:
      name: uploadId
      in: path
      required: true
      description: The `upload_id` returned by `createAvatarUpload`.
      schema:
        $ref: '#/components/schemas/Uuid'
    AvatarId:
      name: avatarId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PhotoVariant:
      name: variant
      in: path
      required: true
      description: '`thumb` (longest edge 320 px), `medium` (1024 px) or `large` (2048 px).'
      schema:
        type: string
        enum: [thumb, medium, large]
    AvatarVariant:
      name: variant
      in: path
      required: true
      description: '`small` (128 px square) or `medium` (512 px square).'
      schema:
        type: string
        enum: [small, medium]
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      required: true
      description: First date of the range (inclusive), in the dormitory time zone.
      schema:
        $ref: '#/components/schemas/Date'
    ToDate:
      name: to
      in: query
      required: true
      description: Last date of the range (inclusive), in the dormitory time zone.
      schema:
        $ref: '#/components/schemas/Date'
    AuditActionFilter:
      name: action
      in: query
      description: Filter by action name or prefix, for example `comment.` or `auth.login_failed`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z][a-z_.]*$'

  headers:
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RequestId:
      description: Server-generated request ID. Quote it when reporting a problem.
      schema:
        type: string
    WwwAuthenticate:
      description: '`Bearer` challenge for native clients, for example `Bearer error="invalid_token"`.'
      schema:
        type: string
    SetAuthCookies:
      description: |
        Sets `__Host-kk_access`, `__Secure-kk_refresh` and `__Host-kk_csrf` (one `Set-Cookie` header per
        cookie). All are `Secure`; access and refresh cookies are `HttpOnly`.
      schema:
        type: string
    ClearAuthCookies:
      description: Expires the three authentication cookies (web clients).
      schema:
        type: string
    CacheControl:
      description: '`private, max-age=31536000, immutable` for image variants.'
      schema:
        type: string
    ETag:
      description: Strong entity tag of the image variant.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        Malformed request: invalid JSON, unknown fields, wrong parameter format, unsupported content
        type (`bad_request`), or more than one kind of credential (`ambiguous_credentials`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: Request body is not valid JSON.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    Unauthorized:
      description: |
        Missing, invalid or expired credentials (`unauthenticated`), wrong login data
        (`invalid_credentials`), unknown or used one-time token (`invalid_token`), or revoked session
        (`session_revoked`). Clients try one refresh, then send the user to the login screen.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: Authentication required.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    Forbidden:
      description: |
        Authenticated but not allowed: missing role or scope (`forbidden`), missing or invalid CSRF token
        or disallowed `Origin` (`csrf_failed`), read-only because of a suspension (`suspended`), banned
        from the dormitory (`banned`), banned account (`account_banned`), feature turned off by the
        dormitory (`feature_disabled`), or invitation needed (`invitation_required`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: This action requires the moderator role.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    NotFound:
      description: |
        The resource does not exist or the caller may not know that it exists (for example a
        resource of a dormitory the caller is not a member of). Invalid invitation codes return
        `invitation_invalid`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Resource not found.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    Conflict:
      description: |
        The request conflicts with the current state: `already_exists`, `already_member`,
        `already_reported`, `last_admin`, `rating_closed`, `upload_missing` or `conflict`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rating_closed
              message: This meal cannot be rated yet.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    ValidationFailed:
      description: Well-formed request that breaks validation rules (`validation_failed`, or `image_rejected` for uploads).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Some fields are invalid.
              details:
                - field: value
                  reason: out_of_range
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again later.
              request_id: 01JDXK3Q6ZC2M4V8RXM9Y7T5PA
    JpegImage:
      description: JPEG image re-encoded by the server without metadata.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg

  schemas:
    # ---------------------------------------------------------------- primitives
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the server.
      examples: [0193a7c4-5e1b-7c3a-9f4e-2b6d8a1c0e57]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
    Date:
      type: string
      format: date
      description: Calendar date (YYYY-MM-DD).
    Slug:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      examples: [petofi-kollegium]
    Locale:
      type: string
      enum: [hu, en]
      description: User interface language. Hungarian is the default.
    DormitoryRole:
      type: string
      enum: [member, moderator, admin]
      description: Role inside one dormitory. `admin` is the dormitory administrator.
    RatingValue:
      type: integer
      minimum: 1
      maximum: 5
      description: |
        Numeric rating. Clients display these exact labels (docs/DECISIONS.md) via i18n:
        1 = "Le se menj", 2 = "Ha nem vagy éhenhalás szélén, hagyd", 3 = "Ehető, ha nincs más",
        4 = "Amúgy eskü nem olyan szar", 5 = "Már határozottan ehetőnek nevezhető".
    RecommendationValue:
      type: string
      enum: [recommended, not_recommended]
    MealPeriod:
      type: string
      enum: [breakfast, lunch, dinner, all_day]
    MenuStatus:
      type: string
      enum: [draft, published]
    Allergen:
      type: string
      description: One of the 14 allergen groups of Annex II of Regulation (EU) No 1169/2011.
      enum: [gluten, crustaceans, eggs, fish, peanuts, soybeans, milk, tree_nuts, celery, mustard, sesame, sulphites, lupin, molluscs]
    ImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    ApiKeyScope:
      type: string
      enum: ['dormitories:read', 'menus:read', 'menus:write', 'stats:read', 'announcements:write']
    ReportStatus:
      type: string
      enum: [open, resolved]
    SanctionKind:
      type: string
      enum: [suspension, ban]
    NextCursor:
      type: [string, 'null']
      description: Cursor of the next page, or null on the last page.

    # ---------------------------------------------------------------- errors
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              maxLength: 500
              description: English fallback text for developers. Clients localize by `code`.
            details:
              type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              maxLength: 64
    ErrorCode:
      type: string
      enum:
        - bad_request
        - ambiguous_credentials
        - unauthenticated
        - invalid_credentials
        - invalid_token
        - session_revoked
        - forbidden
        - csrf_failed
        - suspended
        - banned
        - account_banned
        - feature_disabled
        - invitation_required
        - not_found
        - invitation_invalid
        - conflict
        - already_exists
        - already_member
        - already_reported
        - last_admin
        - rating_closed
        - upload_missing
        - validation_failed
        - image_rejected
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - internal_error
        - service_unavailable
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          maxLength: 100
          description: JSON pointer-like path of the field, for example `meals[2].name`.
        reason:
          type: string
          enum:
            - required
            - unknown_field
            - too_short
            - too_long
            - too_small
            - too_large
            - out_of_range
            - invalid_format
            - invalid_value
            - not_allowed
            - duplicate
            - incorrect
            - too_common
            - unsupported_type
            - invalid_image
            - dimensions_exceeded
            - range_too_long

    # ---------------------------------------------------------------- meta
    InstanceMeta:
      type: object
      required: [name, api_version, server_version, license, source_code_url, dormitory_creation, limits, legal]
      properties:
        name:
          type: string
          description: Instance display name configured by the operator.
        api_version:
          type: string
          const: v1
        server_version:
          type: string
        license:
          type: string
          const: AGPL-3.0-only
        source_code_url:
          type: string
          format: uri
          description: Where users of this instance can obtain the corresponding source code.
        dormitory_creation:
          type: string
          enum: [global_admins, all_users]
        limits:
          type: object
          required: [photo_max_bytes, photo_content_types, password_min_length, password_max_length]
          properties:
            photo_max_bytes:
              type: integer
            photo_content_types:
              type: array
              items:
                $ref: '#/components/schemas/ImageContentType'
            password_min_length:
              type: integer
            password_max_length:
              type: integer
        legal:
          type: object
          description: Operator-provided links; null when the operator has not configured them.
          required: [privacy_policy_url, terms_url, trademarks_url, operator_contact]
          properties:
            privacy_policy_url:
              type: [string, 'null']
              format: uri
            terms_url:
              type: [string, 'null']
              format: uri
            trademarks_url:
              type: [string, 'null']
              format: uri
            operator_contact:
              type: [string, 'null']
              maxLength: 200
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, unavailable]
            storage:
              type: string
              enum: [ok, unavailable]

    # ---------------------------------------------------------------- users and auth
    UserRef:
      type: object
      description: Public view of a user inside a shared dormitory.
      required: [id, display_name, avatar, deleted]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: [string, 'null']
          description: Null for deleted accounts; clients show a localized "deleted user" text.
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarRef'
            - type: 'null'
        deleted:
          type: boolean
    AvatarRef:
      type: object
      required: [id, urls]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        urls:
          type: object
          required: [small, medium]
          properties:
            small:
              type: string
              format: uri-reference
              examples: [/api/v1/avatars/0193a7c4-5e1b-7c3a-9f4e-2b6d8a1c0e57/images/small]
            medium:
              type: string
              format: uri-reference
    NotificationSettings:
      type: object
      required: [comments, announcements]
      properties:
        comments:
          type: boolean
          description: Notify about new comments on meals the user commented on.
        announcements:
          type: boolean
          description: Notify about important dormitory announcements.
    CurrentUser:
      type: object
      required: [id, email, display_name, locale, avatar, is_global_admin, notification_settings, restriction, created_at, password_changed_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarRef'
            - type: 'null'
        is_global_admin:
          type: boolean
        notification_settings:
          $ref: '#/components/schemas/NotificationSettings'
        restriction:
          description: Active instance-wide suspension, if any (the account is read-only).
          oneOf:
            - $ref: '#/components/schemas/SanctionSummary'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        password_changed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      description: 12-128 characters (Unicode code points). Common passwords are rejected.
    DisplayName:
      type: string
      minLength: 2
      maxLength: 40
      description: Trimmed and NFC-normalized by the server; control characters are rejected.
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        locale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
    NativeLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
        device_label:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown in the session list, for example "Pixel 8".
    NativeRefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 43
          maxLength: 128
    SessionInfo:
      type: object
      required: [id, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    AuthSession:
      type: object
      required: [user, session, access_token_expires_at]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        access_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
    NativeTokens:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, session, user]
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
        access_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
        refresh_token:
          type: string
          description: Opaque, single-use. Store only in the Keystore / Keychain.
        refresh_token_expires_at:
          $ref: '#/components/schemas/Timestamp'
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/CurrentUser'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 32 random bytes, base64url without padding.
        new_password:
          $ref: '#/components/schemas/NewPassword'
    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        locale:
          $ref: '#/components/schemas/Locale'
        notification_settings:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            comments:
              type: boolean
            announcements:
              type: boolean
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [new_email, current_password]
      properties:
        new_email:
          $ref: '#/components/schemas/Email'
        current_password:
          type: string
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          $ref: '#/components/schemas/NewPassword'
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
    Session:
      type: object
      required: [id, client_type, device_label, ip_network, created_at, last_used_at, expires_at, current]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        client_type:
          type: string
          enum: [web, native]
        device_label:
          type: [string, 'null']
        ip_network:
          type: [string, 'null']
          description: Truncated network of the last login (IPv4 /24, IPv6 /48), never the full address.
          examples: [203.0.113.0/24]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
    SessionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    UserStats:
      type: object
      required: [ratings_count, comments_count, photos_count, recommendations_count, dormitories_count]
      properties:
        ratings_count:
          type: integer
        comments_count:
          type: integer
        photos_count:
          type: integer
        recommendations_count:
          type: integer
        dormitories_count:
          type: integer
    MyRating:
      type: object
      required: [dormitory_id, meal, value, created_at, updated_at]
      properties:
        dormitory_id:
          $ref: '#/components/schemas/Uuid'
        meal:
          type: object
          required: [id, name, menu_date, meal_period]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            menu_date:
              $ref: '#/components/schemas/Date'
            meal_period:
              $ref: '#/components/schemas/MealPeriod'
        value:
          $ref: '#/components/schemas/RatingValue'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    MyRatingPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyRating'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UserDataExport:
      type: object
      description: |
        Personal data and content of the user. Dormitory names are included only for dormitories in
        which the user is still an active member; otherwise only IDs.
      required: [format_version, generated_at, account, memberships, ratings, recommendations, comments, photos, sessions, sanctions]
      properties:
        format_version:
          type: integer
          const: 1
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        account:
          $ref: '#/components/schemas/CurrentUser'
        memberships:
          type: array
          items:
            type: object
            required: [dormitory_id, dormitory_name, role, joined_at, left_at]
            properties:
              dormitory_id:
                $ref: '#/components/schemas/Uuid'
              dormitory_name:
                type: [string, 'null']
              role:
                $ref: '#/components/schemas/DormitoryRole'
              joined_at:
                $ref: '#/components/schemas/Timestamp'
              left_at:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
        ratings:
          type: array
          items:
            type: object
            required: [dormitory_id, meal_id, value, created_at, updated_at]
            properties:
              dormitory_id:
                $ref: '#/components/schemas/Uuid'
              meal_id:
                $ref: '#/components/schemas/Uuid'
              value:
                $ref: '#/components/schemas/RatingValue'
              created_at:
                $ref: '#/components/schemas/Timestamp'
              updated_at:
                $ref: '#/components/schemas/Timestamp'
        recommendations:
          type: array
          items:
            type: object
            required: [dormitory_id, meal_id, value, created_at, updated_at]
            properties:
              dormitory_id:
                $ref: '#/components/schemas/Uuid'
              meal_id:
                $ref: '#/components/schemas/Uuid'
              value:
                $ref: '#/components/schemas/RecommendationValue'
              created_at:
                $ref: '#/components/schemas/Timestamp'
              updated_at:
                $ref: '#/components/schemas/Timestamp'
        comments:
          type: array
          items:
            type: object
            required: [id, dormitory_id, meal_id, body, created_at, edited_at, deleted_at]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              dormitory_id:
                $ref: '#/components/schemas/Uuid'
              meal_id:
                $ref: '#/components/schemas/Uuid'
              body:
                type: [string, 'null']
              created_at:
                $ref: '#/components/schemas/Timestamp'
              edited_at:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
              deleted_at:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
        photos:
          type: array
          items:
            type: object
            required: [id, dormitory_id, meal_id, status, created_at]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              dormitory_id:
                $ref: '#/components/schemas/Uuid'
              meal_id:
                $ref: '#/components/schemas/Uuid'
              status:
                type: string
              created_at:
                $ref: '#/components/schemas/Timestamp'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        sanctions:
          type: array
          items:
            $ref: '#/components/schemas/SanctionSummary'

    # ---------------------------------------------------------------- uploads
    UploadRequest:
      type: object
      additionalProperties: false
      required: [content_type, byte_size]
      properties:
        content_type:
          $ref: '#/components/schemas/ImageContentType'
        byte_size:
          type: integer
          minimum: 1
          maximum: 26214400
          description: Exact size of the file. Must not exceed `limits.photo_max_bytes` from `GET /meta`.
    UploadTicket:
      type: object
      description: |
        Presigned POST policy for object storage. Send a `multipart/form-data` POST to `url` with every
        entry of `fields` (in any order) and the file last, in the form field named by `file_field`.
        The policy limits key, content type and size and expires at `expires_at`. `url` is either the
        `/storage/<bucket>` path of the instance or a separate storage origin chosen by the operator;
        do not send cookies or `Authorization` to it. A successful upload returns `204` without a body.
      required: [upload_id, method, url, fields, file_field, max_bytes, expires_at]
      properties:
        upload_id:
          $ref: '#/components/schemas/Uuid'
        method:
          type: string
          const: POST
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        file_field:
          type: string
          const: file
        max_bytes:
          type: integer
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    PhotoUploadTicket:
      type: object
      required: [photo_id, upload]
      properties:
        photo_id:
          $ref: '#/components/schemas/Uuid'
        upload:
          $ref: '#/components/schemas/UploadTicket'

    # ---------------------------------------------------------------- notifications
    Notification:
      type: object
      required: [id, kind, dormitory_id, payload, occurrences, occurred_at, read_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - comment.created
            - announcement.published
            - moderation.content_removed
            - moderation.sanction_applied
            - moderation.sanction_lifted
            - moderation.report_resolved
            - membership.role_changed
            - membership.admin_assigned
            - account.password_reset_issued
        dormitory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        payload:
          type: object
          additionalProperties: true
          description: |
            Kind-specific identifiers and short display texts, for example
            `{"meal_id": "...", "meal_name": "Rántott sajt"}` for `comment.created` or
            `{"announcement_id": "...", "title": "..."}` for `announcement.published`.
            Clients build the localized message from `kind` and these fields.
        occurrences:
          type: integer
          minimum: 1
          description: Number of grouped events (for example new comments on the same meal).
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        read_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    NotificationPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0

    # ---------------------------------------------------------------- dormitories and members
    DormitorySettings:
      type: object
      required: [comments_enabled, photos_enabled, rating_window_days]
      properties:
        comments_enabled:
          type: boolean
        photos_enabled:
          type: boolean
        rating_window_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Days after the menu date during which meals can be rated; null = no limit.
    MembershipInfo:
      type: object
      required: [role, is_trusted_reviewer, joined_at, restriction]
      properties:
        role:
          $ref: '#/components/schemas/DormitoryRole'
        is_trusted_reviewer:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        restriction:
          description: Active suspension in this dormitory, if any (read-only).
          oneOf:
            - $ref: '#/components/schemas/SanctionSummary'
            - type: 'null'
    Dormitory:
      type: object
      required: [id, slug, name, description, city, address, visibility, join_policy, timezone, settings, member_count, created_at, updated_at, my_membership]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
        description:
          type: [string, 'null']
        city:
          type: [string, 'null']
        address:
          type: [string, 'null']
        visibility:
          type: string
          enum: [public, private]
        join_policy:
          type: string
          enum: [open, invite_only]
        timezone:
          type: string
          examples: [Europe/Budapest]
        settings:
          $ref: '#/components/schemas/DormitorySettings'
        member_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        my_membership:
          oneOf:
            - $ref: '#/components/schemas/MembershipInfo'
            - type: 'null'
    DormitorySummary:
      type: object
      required: [id, slug, name, city, description, visibility, join_policy, member_count, is_member]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
        city:
          type: [string, 'null']
        description:
          type: [string, 'null']
        visibility:
          type: string
          enum: [public, private]
        join_policy:
          type: string
          enum: [open, invite_only]
        member_count:
          type: integer
        is_member:
          type: boolean
    DormitorySummaryPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DormitorySummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    DormitorySettingsInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        comments_enabled:
          type: boolean
        photos_enabled:
          type: boolean
        rating_window_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
    CreateDormitoryRequest:
      type: object
      additionalProperties: false
      required: [slug, name, visibility, join_policy]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        city:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          type: string
          enum: [public, private]
        join_policy:
          type: string
          enum: [open, invite_only]
          description: Must be `invite_only` for private dormitories.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          default: Europe/Budapest
          description: IANA time zone name.
        settings:
          $ref: '#/components/schemas/DormitorySettingsInput'
    UpdateDormitoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        city:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        address:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
        visibility:
          type: string
          enum: [public, private]
        join_policy:
          type: string
          enum: [open, invite_only]
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        settings:
          $ref: '#/components/schemas/DormitorySettingsInput'
    Membership:
      type: object
      required: [dormitory, role, is_trusted_reviewer, joined_at, restriction]
      properties:
        dormitory:
          $ref: '#/components/schemas/DormitorySummary'
        role:
          $ref: '#/components/schemas/DormitoryRole'
        is_trusted_reviewer:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        restriction:
          oneOf:
            - $ref: '#/components/schemas/SanctionSummary'
            - type: 'null'
    MembershipList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Member:
      type: object
      required: [user, role, is_trusted_reviewer, joined_at]
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        role:
          $ref: '#/components/schemas/DormitoryRole'
        is_trusted_reviewer:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    MemberProfile:
      type: object
      required: [user, role, is_trusted_reviewer, joined_at, stats, reputation]
      properties:
        user:
          $ref: '#/components/schemas/UserRef'
        role:
          $ref: '#/components/schemas/DormitoryRole'
        is_trusted_reviewer:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        stats:
          type: object
          description: Counts in this dormitory only.
          required: [ratings_count, comments_count, photos_count, recommendations_count]
          properties:
            ratings_count:
              type: integer
            comments_count:
              type: integer
            photos_count:
              type: integer
            recommendations_count:
              type: integer
        reputation:
          type: object
          description: Computed from contributions in this dormitory (formula in docs/ARCHITECTURE.md).
          required: [score, level]
          properties:
            score:
              type: integer
              minimum: 0
            level:
              type: string
              enum: [newcomer, regular, active, veteran]
    MemberPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/DormitoryRole'
        is_trusted_reviewer:
          type: boolean

    # ---------------------------------------------------------------- sanctions
    SanctionSummary:
      type: object
      required: [id, kind, dormitory_id, starts_at, ends_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SanctionKind'
        dormitory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Sanction:
      type: object
      required: [id, user, dormitory_id, kind, reason, report_id, starts_at, ends_at, created_by, created_at, revoked_at, revoked_by, revoke_reason, active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        user:
          $ref: '#/components/schemas/UserRef'
        dormitory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/SanctionKind'
        reason:
          type: string
        report_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        revoke_reason:
          type: [string, 'null']
        active:
          type: boolean
    SanctionPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sanction'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    SanctionInput:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind:
          $ref: '#/components/schemas/SanctionKind'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to the sanctioned user.
        ends_at:
          $ref: '#/components/schemas/Timestamp'
    CreateSanctionRequest:
      type: object
      additionalProperties: false
      required: [user_id, kind, reason]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SanctionKind'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        report_id:
          $ref: '#/components/schemas/Uuid'
    AdminCreateSanctionRequest:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind:
          $ref: '#/components/schemas/SanctionKind'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        report_id:
          $ref: '#/components/schemas/Uuid'
    RevokeSanctionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ---------------------------------------------------------------- invitations
    Invitation:
      type: object
      required: [id, label, code_hint, max_uses, use_count, expires_at, created_at, created_by, revoked_at, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: [string, 'null']
        code_hint:
          type: string
          description: Last four characters of the code.
        max_uses:
          type: [integer, 'null']
        use_count:
          type: integer
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/UserRef'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        status:
          type: string
          enum: [active, expired, exhausted, revoked]
    InvitationPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    InvitationCreated:
      type: object
      required: [invitation, code]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        code:
          type: string
          description: The full code (16 Crockford base32 characters, grouped by dashes). Shown once.
          examples: [7K3M-QX9P-2R4T-HV8W]
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        max_uses:
          type: integer
          minimum: 1
          maximum: 10000
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 180
          default: 14
    InvitationCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 16
          maxLength: 32
          pattern: '^[0-9A-Za-z -]+$'
          description: Case-insensitive; spaces and dashes are ignored.
    InvitationPreview:
      type: object
      required: [dormitory, expires_at]
      properties:
        dormitory:
          $ref: '#/components/schemas/DormitorySummary'
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    # ---------------------------------------------------------------- menus and meals
    MealCategory:
      type: object
      required: [id, name, position]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        position:
          type: integer
    MealCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MealCategory'
    CreateMealCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        position:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
    UpdateMealCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        position:
          type: integer
          minimum: 0
          maximum: 1000
    MealStats:
      type: object
      required: [rating_count, rating_average, rating_distribution, trusted_rating_count, trusted_rating_average, recommended_count, not_recommended_count]
      properties:
        rating_count:
          type: integer
          minimum: 0
        rating_average:
          type: [number, 'null']
          minimum: 1
          maximum: 5
          description: Rounded to two decimals; null without ratings.
        rating_distribution:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: integer
            minimum: 0
          description: Number of ratings with value 1, 2, 3, 4 and 5 (index 0 = value 1).
        trusted_rating_count:
          type: integer
          minimum: 0
        trusted_rating_average:
          type: [number, 'null']
          minimum: 1
          maximum: 5
          description: |
            Average of trusted reviewers only. Null while `trusted_rating_count` is below 3, because the
            trusted reviewers are known to members and a smaller group would reveal individual ratings.
        recommended_count:
          type: integer
          minimum: 0
        not_recommended_count:
          type: integer
          minimum: 0
    PhotoUrls:
      type: object
      required: [thumb, medium, large]
      properties:
        thumb:
          type: string
          format: uri-reference
        medium:
          type: string
          format: uri-reference
        large:
          type: string
          format: uri-reference
    PhotoRef:
      type: object
      required: [id, width, height, urls]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        width:
          type: integer
        height:
          type: integer
        urls:
          $ref: '#/components/schemas/PhotoUrls'
    MealSummary:
      type: object
      required: [id, menu_id, category, name, description, allergens, allergen_note, position, stats, my_rating, my_recommendation, comment_count, photo_count, cover_photo]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        menu_id:
          $ref: '#/components/schemas/Uuid'
        category:
          oneOf:
            - $ref: '#/components/schemas/MealCategory'
            - type: 'null'
        name:
          type: string
        description:
          type: [string, 'null']
        allergens:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Allergen'
          description: Null = not provided by the dormitory; empty = declared free of the 14 groups.
        allergen_note:
          type: [string, 'null']
        position:
          type: integer
        stats:
          $ref: '#/components/schemas/MealStats'
        my_rating:
          oneOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        my_recommendation:
          oneOf:
            - $ref: '#/components/schemas/RecommendationValue'
            - type: 'null'
        comment_count:
          type: integer
        photo_count:
          type: integer
        cover_photo:
          oneOf:
            - $ref: '#/components/schemas/PhotoRef'
            - type: 'null'
    MealDetail:
      type: object
      required: [id, menu, category, name, description, allergens, allergen_note, position, stats, my_rating, my_recommendation, comment_count, photo_count, cover_photo, rating_open, rating_closes_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        menu:
          type: object
          required: [id, menu_date, meal_period, status]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            menu_date:
              $ref: '#/components/schemas/Date'
            meal_period:
              $ref: '#/components/schemas/MealPeriod'
            status:
              $ref: '#/components/schemas/MenuStatus'
        category:
          oneOf:
            - $ref: '#/components/schemas/MealCategory'
            - type: 'null'
        name:
          type: string
        description:
          type: [string, 'null']
        allergens:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Allergen'
        allergen_note:
          type: [string, 'null']
        position:
          type: integer
        stats:
          $ref: '#/components/schemas/MealStats'
        my_rating:
          oneOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        my_recommendation:
          oneOf:
            - $ref: '#/components/schemas/RecommendationValue'
            - type: 'null'
        comment_count:
          type: integer
        photo_count:
          type: integer
        cover_photo:
          oneOf:
            - $ref: '#/components/schemas/PhotoRef'
            - type: 'null'
        rating_open:
          type: boolean
          description: Whether ratings, recommendations and photos are accepted now.
        rating_closes_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Menu:
      type: object
      required: [id, dormitory_id, menu_date, meal_period, title, note, status, published_at, meals, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dormitory_id:
          $ref: '#/components/schemas/Uuid'
        menu_date:
          $ref: '#/components/schemas/Date'
        meal_period:
          $ref: '#/components/schemas/MealPeriod'
        title:
          type: [string, 'null']
        note:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/MenuStatus'
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        meals:
          type: array
          items:
            $ref: '#/components/schemas/MealSummary'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    MenuList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
    DayMenus:
      type: object
      required: [date, timezone, menus]
      properties:
        date:
          $ref: '#/components/schemas/Date'
        timezone:
          type: string
        menus:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
    WeekMenus:
      type: object
      required: [week_start, week_end, timezone, days]
      properties:
        week_start:
          $ref: '#/components/schemas/Date'
        week_end:
          $ref: '#/components/schemas/Date'
        timezone:
          type: string
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [date, menus]
            properties:
              date:
                $ref: '#/components/schemas/Date'
              menus:
                type: array
                items:
                  $ref: '#/components/schemas/Menu'
    CreateMealRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 1000
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allergens:
          type: [array, 'null']
          maxItems: 14
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Allergen'
        allergen_note:
          type: string
          maxLength: 300
        position:
          type: integer
          minimum: 0
          maximum: 1000
    UpdateMealRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: [string, 'null']
          maxLength: 1000
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        allergens:
          type: [array, 'null']
          maxItems: 14
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Allergen'
        allergen_note:
          type: [string, 'null']
          maxLength: 300
        position:
          type: integer
          minimum: 0
          maximum: 1000
    CreateMenuRequest:
      type: object
      additionalProperties: false
      required: [menu_date]
      properties:
        menu_date:
          $ref: '#/components/schemas/Date'
        meal_period:
          allOf:
            - $ref: '#/components/schemas/MealPeriod'
          default: lunch
        title:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: string
          maxLength: 1000
        status:
          allOf:
            - $ref: '#/components/schemas/MenuStatus'
          default: draft
        meals:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CreateMealRequest'
    UpdateMenuRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        menu_date:
          $ref: '#/components/schemas/Date'
        meal_period:
          $ref: '#/components/schemas/MealPeriod'
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        note:
          type: [string, 'null']
          maxLength: 1000
        status:
          $ref: '#/components/schemas/MenuStatus'
    RatingRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/RatingValue'
    RatingResult:
      type: object
      required: [rating, stats]
      properties:
        rating:
          type: object
          required: [value, created_at, updated_at]
          properties:
            value:
              $ref: '#/components/schemas/RatingValue'
            created_at:
              $ref: '#/components/schemas/Timestamp'
            updated_at:
              $ref: '#/components/schemas/Timestamp'
        stats:
          $ref: '#/components/schemas/MealStats'
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/RecommendationValue'
    RecommendationResult:
      type: object
      required: [recommendation, stats]
      properties:
        recommendation:
          type: object
          required: [value, updated_at]
          properties:
            value:
              $ref: '#/components/schemas/RecommendationValue'
            updated_at:
              $ref: '#/components/schemas/Timestamp'
        stats:
          $ref: '#/components/schemas/MealStats'

    # ---------------------------------------------------------------- comments and photos
    ContentPermissions:
      type: object
      description: What the caller may do with the item; computed by the server for UI hints only.
      required: [can_edit, can_delete, can_report]
      properties:
        can_edit:
          type: boolean
        can_delete:
          type: boolean
        can_report:
          type: boolean
    Comment:
      type: object
      required: [id, meal_id, author, body, created_at, edited_at, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        meal_id:
          $ref: '#/components/schemas/Uuid'
        author:
          $ref: '#/components/schemas/UserRef'
        body:
          type: string
          description: Plain text. Clients render it as text, never as HTML.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        edited_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        permissions:
          $ref: '#/components/schemas/ContentPermissions'
    CommentPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    UpdateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    Photo:
      type: object
      required: [id, meal_id, author, status, width, height, urls, created_at, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        meal_id:
          $ref: '#/components/schemas/Uuid'
        author:
          $ref: '#/components/schemas/UserRef'
        status:
          type: string
          enum: [pending_upload, ready, rejected]
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        urls:
          oneOf:
            - $ref: '#/components/schemas/PhotoUrls'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        permissions:
          $ref: '#/components/schemas/ContentPermissions'
    PhotoPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------------------------------------------------------------- moderation
    ReportTargetType:
      type: string
      enum: [comment, photo, user]
    ReportReason:
      type: string
      enum: [spam, harassment, hate_speech, inappropriate, misinformation, other]
    ReportResolution:
      type: string
      enum: [content_removed, user_sanctioned, no_action, dismissed]
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type:
          $ref: '#/components/schemas/ReportTargetType'
        target_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          maxLength: 1000
    ReportReceipt:
      type: object
      description: What the reporter sees about their own report.
      required: [id, target_type, target_id, reason, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        target_type:
          $ref: '#/components/schemas/ReportTargetType'
        target_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/ReportReason'
        status:
          $ref: '#/components/schemas/ReportStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Report:
      type: object
      description: Moderator view of a report.
      required: [id, dormitory_id, reporter, target_type, target_id, subject_user, reason, details, content_snapshot, status, resolution, resolution_note, resolved_by, resolved_at, escalated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dormitory_id:
          $ref: '#/components/schemas/Uuid'
        reporter:
          $ref: '#/components/schemas/UserRef'
        target_type:
          $ref: '#/components/schemas/ReportTargetType'
        target_id:
          description: Null if the reported content was purged after resolution.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        subject_user:
          description: The user the report is about (the reported user or the author of the reported content).
          $ref: '#/components/schemas/UserRef'
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: [string, 'null']
        content_snapshot:
          type: [string, 'null']
          description: Text of a reported comment at report time.
        status:
          $ref: '#/components/schemas/ReportStatus'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ReportResolution'
            - type: 'null'
        resolution_note:
          type: [string, 'null']
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        escalated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ReportPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ResolveReportRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution:
          $ref: '#/components/schemas/ReportResolution'
        note:
          type: string
          maxLength: 1000
        sanction:
          $ref: '#/components/schemas/SanctionInput'
      description: '`sanction` is required when `resolution` is `user_sanctioned` and forbidden otherwise.'
    EscalateReportRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000

    # ---------------------------------------------------------------- announcements
    Announcement:
      type: object
      required: [id, dormitory_id, author, title, body, priority, published_at, expires_at, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dormitory_id:
          $ref: '#/components/schemas/Uuid'
        author:
          description: Null when published through an API key.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        title:
          type: string
        body:
          type: string
          description: Plain text.
        priority:
          type: string
          enum: [normal, important]
        published_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    AnnouncementPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateAnnouncementRequest:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 5000
        priority:
          type: string
          enum: [normal, important]
          default: normal
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    UpdateAnnouncementRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          minLength: 1
          maxLength: 5000
        priority:
          type: string
          enum: [normal, important]
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # ---------------------------------------------------------------- statistics
    MealRank:
      type: object
      required: [meal_id, name, menu_date, rating_average, rating_count, recommended_count, not_recommended_count]
      properties:
        meal_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        menu_date:
          $ref: '#/components/schemas/Date'
        rating_average:
          type: [number, 'null']
        rating_count:
          type: integer
        recommended_count:
          type: integer
        not_recommended_count:
          type: integer
    DormitoryStats:
      type: object
      required: [from, to, totals, rating_average, rating_distribution, top_rated, lowest_rated, most_recommended, most_warned]
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        totals:
          type: object
          required: [meals, ratings, raters, comments, photos, recommended, not_recommended]
          properties:
            meals:
              type: integer
            ratings:
              type: integer
            raters:
              type: integer
              description: Distinct users who rated at least once in the range.
            comments:
              type: integer
            photos:
              type: integer
            recommended:
              type: integer
            not_recommended:
              type: integer
        rating_average:
          type: [number, 'null']
        rating_distribution:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: integer
        top_rated:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MealRank'
        lowest_rated:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MealRank'
        most_recommended:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MealRank'
        most_warned:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MealRank'

    # ---------------------------------------------------------------- API keys and audit
    ApiKey:
      type: object
      required: [id, name, prefix, dormitory_id, scopes, rate_limit_per_minute, created_by, created_at, expires_at, last_used_at, use_count, revoked_at, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        prefix:
          type: string
          description: Public identifier part of the key (`kk_<prefix>_...`).
        dormitory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        rate_limit_per_minute:
          type: integer
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        use_count:
          type: integer
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        status:
          type: string
          enum: [active, expired, revoked]
    ApiKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    ApiKeyCreated:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: The full key. Shown once; store it in the integration's secret store.
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_in_days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 730
        rate_limit_per_minute:
          type: integer
          minimum: 1
          maximum: 1000
          default: 60
    AuditLogEntry:
      type: object
      required: [id, occurred_at, actor_type, actor_user, actor_api_key_id, dormitory_id, action, target_type, target_id, request_id, metadata]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor_type:
          type: string
          enum: [user, api_key, system, anonymous]
        actor_user:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        actor_api_key_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        dormitory_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        action:
          type: string
          examples: [comment.removed]
        target_type:
          type: [string, 'null']
        target_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        request_id:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
    AuditLogPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    # ---------------------------------------------------------------- global administration
    AdminUser:
      type: object
      required: [id, email, display_name, is_global_admin, created_at, last_login_at, deleted_at, dormitory_count, active_sanctions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
        is_global_admin:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        dormitory_count:
          type: integer
        active_sanctions:
          type: array
          items:
            $ref: '#/components/schemas/SanctionSummary'
    AdminUserPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AdminUpdateUserRequest:
      type: object
      additionalProperties: false
      required: [is_global_admin]
      properties:
        is_global_admin:
          type: boolean
    PasswordResetTokenCreated:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: One-time token, shown once.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    AdminDormitory:
      type: object
      required: [id, slug, name, visibility, join_policy, member_count, admin_count, created_at, deleted_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
        visibility:
          type: string
          enum: [public, private]
        join_policy:
          type: string
          enum: [open, invite_only]
        member_count:
          type: integer
        admin_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AdminDormitoryPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDormitory'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AssignDormitoryAdminRequest:
      type: object
      additionalProperties: false
      required: [user_id, reason]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the dormitory needs a new administrator; shown to the dormitory's staff.
    InstanceStats:
      type: object
      required: [users, active_users_30d, dormitories, public_dormitories, ratings, comments, photos, open_escalated_reports, storage_bytes]
      properties:
        users:
          type: integer
        active_users_30d:
          type: integer
        dormitories:
          type: integer
        public_dormitories:
          type: integer
        ratings:
          type: integer
        comments:
          type: integer
        photos:
          type: integer
        open_escalated_reports:
          type: integer
        storage_bytes:
          type: integer
          format: int64
