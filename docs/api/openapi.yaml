      tags: [members]
      operationId: removeMember
      summary: Remove a member
      description: |
        Ends another user's membership. Moderators may remove members; administrators may also remove
        moderators. Nobody can remove a user with an equal or higher role. To prevent rejoining, create
        a `ban` sanction instead.
      security:
        - cookieAuth: []
