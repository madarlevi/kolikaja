#
# KoliKaja API contract (OpenAPI 3.1). This file is the source of truth for the API.
# Workflow: change this file first, then the server, then regenerate the clients
# (see .claude/skills/api-contract/SKILL.md). Breaking changes require /api/v2.
openapi: 3.1.0
info:
  title: KoliKaja API
  version: 1.0.0
  summary: Multi-dormitory food menu and community rating platform.
  description: |
    REST API shared by the KoliKaja web, Android and iOS clients and by server-to-server integrations.

    ## Authentication
    * **Web (`cookieAuth`)**: `POST /auth/web/login` sets HttpOnly cookies. Every state-changing request
      that is authenticated by cookie must also send the `X-CSRF-Token` header with the value of the
      `__Host-kk_csrf` cookie (signed double-submit token bound to the session). In this document that is
      the combined security requirement `cookieAuth` + `csrfToken`.
    * **Native (`bearerAuth`)**: `POST /auth/native/login` returns a short-lived JWT access token and an
      opaque refresh token. Send `Authorization: Bearer <access token>` and refresh with
      `POST /auth/native/refresh`.
    * **Integrations (`apiKeyAuth`)**: `X-API-Key` header. Only operations that list `apiKeyAuth` accept
      keys, and only with a scope listed in `x-api-key-scopes`. A key bound to a dormitory reaches that
      dormitory only.
    * A request carries exactly one kind of credential. Mixing them returns `400 ambiguous_credentials`.

    Refresh tokens rotate on every use. Presenting an already used refresh token revokes the whole
    session (`401 session_revoked`). Clients must run at most one refresh at a time.

    ## Authorization
    `x-required-role` names the minimum role of each operation: `public`, `authenticated`, `member`,
    `moderator`, `admin` (dormitory administrator) or `global_admin`. Roles always come from the
    server-side membership; roles or dormitory IDs sent by clients are never used for authorization.
    For dormitory resources a non-member receives `404` (existence is not revealed) and a member
    without the required role receives `403`. Global administrators act only through `/admin/*`
    operations and are not implicit members of any dormitory.

    ## Errors
    Every error uses the `Error` envelope. Responses never contain stack traces, SQL or internal details.
    `400` means a malformed request (invalid JSON, unknown fields, bad parameter format).
    `422` means a well-formed request that breaks a validation rule; `details` names the fields.
    Clients localize errors by `code`; `message` is an English fallback for developers.

    ## Pagination
    Growing lists use opaque cursors. Pass `next_cursor` from the previous page as `cursor`.
    `next_cursor` is `null` on the last page. `limit` defaults to 20, maximum 100.

    ## Rate limits
    Rate-limited responses carry `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    `429` responses also carry `Retry-After`. `x-rate-limit` names the bucket of each operation;
    the limits are listed in docs/ARCHITECTURE.md.

    ## Conventions
    * Timestamps are RFC 3339 strings in UTC. Menu dates are `YYYY-MM-DD` in the dormitory time zone.
    * Ratings are integers 1-5. Clients show the exact Hungarian labels from docs/DECISIONS.md
      through their i18n resources; the API never returns label texts.
    * Allergen data is supplied by dormitories. Clients must tell users to verify allergen
      information with the food provider.
    * Meals of draft or deleted menus, and their comments, photos and statistics, return `404` to
      callers who may not see drafts.
    * For API key callers, meal objects include aggregate statistics (no personal data) and
      `my_rating` / `my_recommendation` are always null.
    * API keys and invitation codes stop working when their creator loses the administrator role in
      the dormitory (demotion, removal, ban, leaving, account deletion).
    * Response objects may gain new optional fields within v1; clients must ignore unknown fields.
      Request bodies reject unknown fields.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Same origin as the web app (default deployment behind the bundled reverse proxy).
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: meta
    description: Instance information and health probes.
  - name: auth
    description: Registration, login, token refresh, logout and password reset.
  - name: me
    description: The current user's account, settings, statistics and data export.
  - name: sessions
    description: Session management for the current user.
  - name: notifications
    description: In-app notifications of the current user.
  - name: dormitories
    description: Dormitory directory, details and settings.
  - name: members
    description: Dormitory membership, roles and trusted reviewers.
  - name: invitations
    description: Invitation codes for joining dormitories.
  - name: menus
    description: Daily and weekly menus and meal categories.
  - name: meals
    description: Meals, meal statistics, ratings and recommendations.
  - name: comments
    description: Comments on meals.
  - name: photos
    description: Meal photos and profile pictures.
  - name: moderation
    description: Reports, review queue and sanctions.
  - name: announcements
    description: Dormitory announcements.
  - name: stats
    description: Community statistics.
  - name: api-keys
    description: Server-to-server API keys.
  - name: audit
    description: Audit logs.
  - name: admin
    description: Global administration (global administrators only).
paths:
  /meta:
    get:
      tags: [meta]
      operationId: getInstanceMeta
      summary: Get instance information
      description: |
        Public information about this KoliKaja instance. Clients show `source_code_url` in their
        About / Legal screen. Operators who run a modified version must set it to the source of
        that version (see the AGPL-3.0 notes in docs/ARCHITECTURE.md).
      security: []
      x-required-role: public
      x-rate-limit: read
      responses:
        '200':
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceMeta'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /healthz:
    servers:
      - url: /
        description: Health probes are served at the root, outside the versioned API.
    get:
      tags: [meta]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not check dependencies.
      security: []
      x-required-role: public
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    servers:
      - url: /
        description: Health probes are served at the root, outside the versioned API.
    get:
      tags: [meta]
      operationId: getReadiness
      summary: Readiness probe
      description: Returns 200 when the database and object storage are reachable, otherwise 503.
      security: []
      x-required-role: public
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Creates an account. Registration does not log in; call a login operation afterwards.
        Passwords must be 12-128 characters and are rejected if they are common or equal to the e-mail address.
        An already registered e-mail address returns `409 already_exists`. This reveals that the address is
        registered; without e-mail delivery there is no uniform alternative, so it is an accepted risk
        limited by the `register` rate limit (docs/DECISIONS.md T-27).
      security: []
      x-required-role: public
      x-rate-limit: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/web/login:
    post:
      tags: [auth]
      operationId: loginWeb
      summary: Log in (web)
      description: |
        Web login. The `Origin` header must match the configured web origin.
        On success the response sets three cookies: `__Host-kk_access` (access token, HttpOnly),
        `__Secure-kk_refresh` (refresh token, HttpOnly, SameSite=Strict, Path=/api/v1/auth/web/refresh)
        and `__Host-kk_csrf` (CSRF token, readable by JavaScript). Tokens are never returned in the body.
        A wrong e-mail address and a wrong password both return `401 invalid_credentials`.
      security: []
      x-required-role: public
      x-rate-limit: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; cookies are set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/web/refresh:
    post:
      tags: [auth]
      operationId: refreshWeb
      summary: Refresh the web session
      description: |
        Rotates the refresh cookie and issues a new access cookie. Requires the `__Secure-kk_refresh`
        cookie and the `X-CSRF-Token` header. An already used refresh token revokes the session
        (`401 session_revoked`); an unknown or expired token, or a token of a native session, returns
        `401 invalid_token`. The web client serializes refreshes across tabs.
      security:
        - refreshCookie: []
          csrfToken: []
      x-required-role: authenticated
      x-rate-limit: refresh
      responses:
        '200':
          description: Session refreshed; new cookies are set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/native/login:
    post:
      tags: [auth]
      operationId: loginNative
      summary: Log in (native apps)
      description: |
        Native login for the Android and iOS apps. Returns an access token and a refresh token in the
        body. Store both in the Android Keystore / iOS Keychain only.
        A wrong e-mail address and a wrong password both return `401 invalid_credentials`.
      security: []
      x-required-role: public
      x-rate-limit: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeLoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/native/refresh:
    post:
      tags: [auth]
      operationId: refreshNative
      summary: Refresh native tokens
      description: |
        Exchanges a refresh token for a new access token and a new refresh token. The presented
        refresh token becomes invalid. Presenting it again revokes the whole session
        (`401 session_revoked`). Unknown or expired tokens, and tokens of web sessions, return
        `401 invalid_token`. Run at most one refresh at a time per app.
      security: []
      x-required-role: public
      x-rate-limit: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeRefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      description: |
        Revokes the current session. An access token that has expired but carries a valid signature is
        accepted here (only to identify the session), so logging out works after the access token ran
        out. For web clients the auth cookies are always cleared. Native clients delete their stored
        tokens afterwards.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: write
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset a password with a one-time token
      description: |
        Sets a new password with a one-time token that a global administrator issued
        (`POST /admin/users/{userId}/password-reset-tokens`) and handed over out of band.
        Revokes all sessions of the account. Unknown, used or expired tokens return `401 invalid_token`.
      security: []
      x-required-role: public
      x-rate-limit: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: Get the current user
      x-required-role: authenticated
      x-rate-limit: read
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [me]
      operationId: updateCurrentUser
      summary: Update profile and settings
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/email:
    put:
      tags: [me]
      operationId: changeEmail
      summary: Change the e-mail address
      description: Requires the current password. A wrong password returns `422` with reason `incorrect` on `current_password`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: E-mail address changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the password
      description: |
        Requires the current password. Revokes every other session of the account; the current
        session stays valid. A wrong password returns `422` with reason `incorrect` on `current_password`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; other sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/account-deletion:
    post:
      tags: [me]
      operationId: deleteAccount
      summary: Delete the account
      description: |
        Deletes the account after password confirmation. Revokes all sessions, ends all memberships,
        removes the profile picture, comments (text is cleared), photos, ratings, recommendations and
        notifications, and scrubs the e-mail address and display name. Returns `409 last_admin` when the
        user is the only administrator of a dormitory that still has other members.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account deleted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Export my data
      description: |
        Returns a machine-readable copy of the personal data and content of the current user.
        Image files are not embedded.
      x-required-role: authenticated
      x-rate-limit: export
      responses:
        '200':
          description: Data export.
          headers:
            Content-Disposition:
              description: '`attachment; filename="kolikaja-export.json"`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/stats:
    get:
      tags: [me]
      operationId: getMyStats
      summary: Get my statistics
      description: Counts cover dormitories in which the user is currently an active member.
      x-required-role: authenticated
      x-rate-limit: read
      responses:
        '200':
          description: Statistics of the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/ratings:
    get:
      tags: [me]
      operationId: listMyRatings
      summary: List my rating history
      description: Newest first. Only ratings in dormitories where the user is currently an active member.
      x-required-role: authenticated
      x-rate-limit: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of ratings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRatingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/dormitories:
    get:
      tags: [me]
      operationId: listMyDormitories
      summary: List my dormitories
      x-required-role: authenticated
      x-rate-limit: read
      responses:
        '200':
          description: Active memberships of the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/sessions:
    get:
      tags: [sessions]
      operationId: listMySessions
      summary: List my active sessions
      x-required-role: authenticated
      x-rate-limit: read
      responses:
        '200':
          description: Active sessions; `current` marks the session of this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: write
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/sessions/revoke-others:
    post:
      tags: [sessions]
      operationId: revokeOtherSessions
      summary: Log out everywhere else
      description: Revokes every session of the current user except the one making this request.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: write
      responses:
        '204':
          description: Other sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/avatar:
    delete:
      tags: [photos]
      operationId: deleteMyAvatar
      summary: Remove my profile picture
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: write
      responses:
        '204':
          description: Profile picture removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/avatar/uploads:
    post:
      tags: [photos]
      operationId: createAvatarUpload
      summary: Start a profile picture upload
      description: |
        Returns a presigned POST policy for direct upload to object storage. The client sends a
        `multipart/form-data` POST to `upload.url` with every entry of `upload.fields` followed by the
        file in the field named `file`. Then it calls the complete operation.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: authenticated
      x-rate-limit: upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Upload ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/avatar/uploads/{uploadId}/complete:
