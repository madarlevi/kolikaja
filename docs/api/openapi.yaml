  /dormitories/{dormitoryId}/reports:
    parameters:
      - $ref: '#/components/parameters/DormitoryId'
    get:
      tags: [moderation]
      operationId: listReports
      summary: Moderator review queue
      description: |
        Open reports oldest first; resolved reports newest first. A report is visible only to members
        whose role is higher than the current role of its subject (the reported user or the author of the
        reported content): moderators see reports about members, administrators also see reports about
        moderators, and reports about administrators go to the global administrators. Nobody sees reports
        about themselves. The same rule applies to `getReport`, `resolveReport` and `escalateReport`
        (`404` otherwise).
      x-required-role: moderator
      x-rate-limit: read
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/BadRequest'
