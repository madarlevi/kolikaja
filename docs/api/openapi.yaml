        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [moderation]
      operationId: createReport
      summary: Report a comment, photo or user
      description: |
        The target must belong to this dormitory (a reported user must be an active member). One open
        report per reporter and target (`409 already_reported`). Users cannot report themselves or their
        own content. Reports whose subject is a dormitory administrator are escalated to the global
        administrators automatically. The reporter's identity is visible only to the people who handle
        the report.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: member
      x-rate-limit: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
