        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [moderation]
      operationId: createSanction
      summary: Suspend or ban a member
      description: |
        `suspension` makes the user read-only in this dormitory until `ends_at`. `ban` ends the
        membership and blocks rejoining until `ends_at` (or until revoked when `ends_at` is omitted).
        Moderators can sanction members only; administrators can also sanction moderators.
        `user_id` must be a current or former member of this dormitory (otherwise `404`), so the
        operation cannot be used to look up or pre-ban users of other dormitories. A cited `report_id`
        must be a report of this dormitory about this user (`422` otherwise; also enforced by the database).
        The user receives a moderation notification.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      x-required-role: moderator
      x-rate-limit: write
      requestBody:
        required: true
        content:
