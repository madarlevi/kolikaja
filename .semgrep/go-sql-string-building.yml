#
# Custom Semgrep rule: SQL text passed to a database call must be a constant with
# pgx placeholders ($1, $2, ...). Tests: go-sql-string-building.go (semgrep --test .semgrep).
rules:
  - id: kolikaja-go-sql-string-building
    languages: [go]
    severity: ERROR
    message: >-
      SQL passed to $DB.$METHOD is built with fmt.Sprintf, string concatenation or a
      strings.Builder. Use a constant query with pgx placeholders ($1, $2, ...) and pass
      values as arguments (CLAUDE.md, "SQL"). Identifiers that must vary come from an
      allow-list in code, never from input.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      references:
        - https://pkg.go.dev/github.com/jackc/pgx/v5
    patterns:
      - pattern-either:
          # Built inline in the call (with or without a context argument).
          - pattern: $DB.$METHOD($CTX, fmt.Sprintf(...), ...)
          - pattern: $DB.$METHOD(fmt.Sprintf(...), ...)
          - pattern: $DB.$METHOD($CTX, $A + $B, ...)
          - pattern: $DB.$METHOD($A + $B, ...)
          - pattern: $DB.$METHOD($CTX, $SB.String(), ...)
          - pattern: $DB.$METHOD($SB.String(), ...)
          - pattern: $DB.$METHOD($CTX, strings.Join(...), ...)
          - pattern: $DB.$METHOD($CTX, strings.Replace(...), ...)
          - pattern: $DB.$METHOD($CTX, strings.ReplaceAll(...), ...)
          # Built in a variable first (declaration, assignment or append), then passed to the call.
          - pattern: |
              $Q := fmt.Sprintf(...)
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              $Q = fmt.Sprintf(...)
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              var $Q = fmt.Sprintf(...)
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              $Q := $A + $B
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              $Q = $A + $B
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              var $Q = $A + $B
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              $Q += $A
              ...
              $DB.$METHOD($CTX, $Q, ...)
          - pattern: |
              $Q := $SB.String()
              ...
              $DB.$METHOD($CTX, $Q, ...)
          # The same for calls without a context argument (for example pgx Batch.Queue).
          - pattern: |
              $Q := fmt.Sprintf(...)
              ...
              $DB.$METHOD($Q, ...)
          - pattern: |
              $Q := $A + $B
              ...
              $DB.$METHOD($Q, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(Query|QueryRow|Exec|QueryContext|QueryRowContext|ExecContext|Prepare|PrepareContext|Queue|CopyFrom|QueryFunc)$
